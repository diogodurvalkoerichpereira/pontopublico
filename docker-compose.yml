# Banco de desenvolvimento local.
#
# Porta 5433 no host de propósito: a 5432 costuma estar ocupada por instalações
# nativas do PostgreSQL, e versões anteriores à 13 não servem para este projeto
# (26 migrations usam gen_random_uuid()).
#
# O bind é em 127.0.0.1 para não expor o banco na rede local.
#
# TZ e PGTZ explícitos porque este é um sistema de ponto e folha: fuso implícito
# produz erro de competência silencioso.

services:
  db:
    image: postgres:17-alpine
    container_name: meuponto-db
    environment:
      POSTGRES_DB: meu_ponto
      POSTGRES_USER: meuponto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - meuponto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuponto -d meu_ponto"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  meuponto-pgdata:
